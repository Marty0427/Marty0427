name: PocketPass

on:
  # Compiling and testing needs no Apple account and no secrets, and macOS runners are
  # free on a public repository, so this runs on every push that touches the app.
  push:
    branches:
      - "claude/**"
    paths:
      - "PocketPass/**"
      - ".github/workflows/pocketpass.yml"
  # Signing and uploading stay manual: a release should be a decision, not a side effect.
  workflow_dispatch:
    inputs:
      lane:
        description: "What to run"
        type: choice
        default: test
        options:
          - test      # build and unit test on a simulator — no signing, no secrets
          - beta      # build, sign and upload to TestFlight
          - release   # build, sign, upload the build and the listing metadata
          - metadata  # upload the listing text only, no build

concurrency:
  group: pocketpass-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    if: github.event_name == 'push' || inputs.lane == 'test'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Runner images change which simulators they carry, so ask rather than hard-code one.
      # A Pro Max is preferred because its screen is the 6.9" size the App Store asks for.
      - name: Pick a simulator
        id: simulator
        run: |
          read -r UDID DEVICE <<< "$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          phones = [d for runtime, items in runtimes.items() if "iOS" in runtime
                    for d in items if d["name"].startswith("iPhone")]
          if not phones:
              raise SystemExit("no iOS simulator on this runner")
          ranked = sorted(phones, key=lambda d: ("Pro Max" in d["name"], "Pro" in d["name"], d["name"]))
          chosen = ranked[-1]
          print(chosen["udid"], chosen["name"])
          ')"
          echo "Using $DEVICE ($UDID)"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      # Cosmetic only, and never worth failing a build over: a clean status bar is what
      # App Store screenshots are expected to show.
      - name: Dress the status bar
        continue-on-error: true
        run: |
          xcrun simctl boot "${{ steps.simulator.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b || true
          xcrun simctl status_bar "${{ steps.simulator.outputs.udid }}" override \
            --time "9:41" \
            --batteryState charged --batteryLevel 100 \
            --cellularMode active --cellularBars 4 \
            --wifiMode active --wifiBars 3 || true

      - name: xcodebuild test
        working-directory: PocketPass
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project PocketPass.xcodeproj \
            -scheme PocketPass \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath build/PocketPass.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/xcodebuild.log

      # The UI tests photograph each screen; pull those out of the result bundle as PNGs.
      - name: Extract screenshots
        if: always()
        working-directory: PocketPass
        run: |
          xcrun xcresulttool export attachments \
            --path build/PocketPass.xcresult \
            --output-path build/screenshots || echo "Attachment export failed; the result bundle is still uploaded."

          # Attachments come out with generated names; the manifest carries the readable ones.
          # Renaming is a convenience, so nothing in here may fail the job.
          python3 - <<'PY'
          import json, pathlib

          def walk(node):
              if isinstance(node, dict):
                  if "exportedFileName" in node:
                      yield node
                  for value in node.values():
                      yield from walk(value)
              elif isinstance(node, list):
                  for value in node:
                      yield from walk(value)

          try:
              directory = pathlib.Path("build/screenshots")
              manifest = directory / "manifest.json"
              if manifest.exists():
                  for attachment in walk(json.loads(manifest.read_text())):
                      source = directory / attachment["exportedFileName"]
                      name = attachment.get("suggestedHumanReadableName") or source.name
                      if not source.exists():
                          continue
                      target = directory / (name if name.lower().endswith(".png") else name + ".png")
                      source.rename(target)
                      print(f"{source.name} -> {target.name}")
              else:
                  print("No manifest; leaving the exported names as they are.")
          except Exception as error:
              print(f"Renaming skipped: {error}")
          PY

          ls -la build/screenshots || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocketpass-screenshots
          path: PocketPass/build/screenshots/*.png
          if-no-files-found: warn
          retention-days: 30

      # The point of this job is the error list, so put it where it can be read without
      # scrolling a 10,000 line log.
      - name: Summarise failures
        if: failure()
        working-directory: PocketPass
        run: |
          {
            echo "### Compiler and test failures"
            echo
            echo '```'
            grep -E "(error:|failed|Failing tests)" build/xcodebuild.log \
              | grep -v "^ *$" | sort -u | head -n 60 || echo "No lines matched; see the full log artefact."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload log and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocketpass-test
          path: |
            PocketPass/build/xcodebuild.log
            PocketPass/build/PocketPass.xcresult
          if-no-files-found: ignore
          retention-days: 7

  ship:
    name: ${{ inputs.lane }}
    if: github.event_name == 'workflow_dispatch' && inputs.lane != 'test'
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: PocketPass
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          working-directory: PocketPass

      - name: Install fastlane
        run: bundle install --jobs 4

      - name: Run ${{ inputs.lane }}
        run: bundle exec fastlane ${{ inputs.lane }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          DEVELOPER_TEAM_ID: ${{ secrets.DEVELOPER_TEAM_ID }}
          POCKETPASS_BUNDLE_ID: ${{ vars.POCKETPASS_BUNDLE_ID }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"

      - name: Upload build artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocketpass-${{ inputs.lane }}
          path: |
            PocketPass/build/*.ipa
            PocketPass/build/*.app.dSYM.zip
          if-no-files-found: ignore
          retention-days: 7
